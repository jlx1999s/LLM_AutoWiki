[project]
name = "llm-autowiki-backend"
version = "0.1.0"
description = "Python backend for Binary Thinking Wiki Studio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0,<0.117.0",
  "uvicorn[standard]>=0.30.0,<0.32.0",
  "pydantic-settings>=2.3.0,<2.6.0",
  "sqlalchemy>=2.0.30,<2.1.0",
  "alembic>=1.13.2,<1.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<8.4.0",
  "httpx>=0.27.0,<0.28.0",
]

[build-system]
requires = ["setuptools>=58", "wheel"]
build-backend = "setuptools.build_meta"
